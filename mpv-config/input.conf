# MPV-UOS · teclas, y solo teclas. Todas documentadas en docs/ATAJOS.md (lo comprueba tests/test_atajos.py).
# H46: aquí ya no hay comentarios de menú (los que uosc lee para construir el suyo). Montaban un SEGUNDO menú,
# el nativo de uosc, con 119 entradas y 40 en el primer nivel: peor que el nuestro y donde se colaban las
# duplicaciones. El único menú es mu-menu: tecla MENU, clic derecho, alt+m y el botón ▦ de la barra. Lo que solo
# vivía en el otro (repetir la lista, orden aleatorio) se trajo a él antes de retirarlo.
# OJO al editar: una línea de comentario que lleve la marca de menú de uosc vuelve a crear ese segundo menú.
# Los atajos por defecto de mpv 0.41 siguen activos salvo los que se redefinen aquí (tabla en docs/ATAJOS.md).

# — el menú, la paleta y la ayuda
MENU        script-binding mu_menu/root
MBTN_RIGHT  script-binding mu_menu/root
alt+m       script-binding mu_menu/root
alt+p       script-binding mu_menu/palette
alt+h       script-binding mu_menu/recents
?           script-binding mu_menu/help

# — abrir y reproducir
SPACE       cycle pause
o           script-binding uosc/open-file
ctrl+o      script-binding mu_ytdl/ytdl-gate
ctrl+v      loadfile "${clipboard/text}" replace
ctrl+u      script-binding mu_ytdl/open-url
ctrl+f      script-binding mu_ytdl/yt-search
p           script-binding uosc/playlist
c           script-binding uosc/chapters
e           script-binding uosc/editions
f           cycle fullscreen
A           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
d           cycle deinterlace
ctrl+q      script-binding uosc/stream-quality
m           cycle mute
a           script-binding uosc/audio
s           script-binding uosc/subtitles
alt+s       script-binding uosc/load-subtitles
v           cycle sub-visibility
ctrl+alt+v  cycle secondary-sub-visibility
[           multiply speed 1/1.1
]           multiply speed 1.1
BS          set speed 1.0
L           cycle-values loop-file "inf" "no"
l           script-binding mu_cut/cut-loop
ctrl+x      script-binding mu_cut/cut-mark
ctrl+l      script-binding mu_cut/cut-menu
n           script-binding mu_notes/notes-add
g           script-binding mu_menu/goto
ctrl+s      async screenshot
ctrl+alt+o  script-binding uosc/open-config-directory
alt+o       script-binding uosc/show-in-directory

# — TV y radio
alt+t       script-binding mu_iptv/tv-menu
alt+f       script-binding mu_iptv/tv-search
alt+UP      script-binding mu_iptv/zap-next
alt+DOWN    script-binding mu_iptv/zap-prev
alt+G       script-binding mu_iptv/tv-guide

# — grabar
alt+r       script-binding mu_record/record-toggle

# — internet (yt-dlp), descargas y conversiones
alt+y       script-binding mu_ytdl/ytdl-menu
alt+a       script-binding mu_ytdl/ytdl-toggle-audio
alt+q       script-binding mu_ytdl/ytdl-quality
alt+d       script-binding mu_ytdl/ytdl-download
alt+l       script-binding mu_ytdl/ytdl-downloads
alt+C       script-binding mu_convert/convert-menu
alt+T       script-binding mu_convert/tasks-menu
alt+Y       script-binding mu_feeds/feeds-menu

# — subtítulos
alt+i       script-binding mu_subs/subs-menu
alt+c       script-binding mu_subs/subs-toggle
alt+x       script-binding mu_subs/subs-resync
alt+S       script-binding mu_subs/subs-save

# — imagen y sonido
alt+v       script-binding mu_av/av-menu
alt+n       script-binding mu_av/av-night

# — saltar intro y créditos
alt+k       script-binding mu_intro/skip
alt+j       script-binding mu_intro/intro-menu

# — estudio y notas
alt+e       script-binding mu_study/study-menu
alt+w       script-binding mu_study/repeat-line
alt+LEFT    script-binding mu_study/repeat-prev
alt+RIGHT   script-binding mu_study/repeat-next
alt+g       script-binding mu_study/smart-speed
alt+b       script-binding mu_study/note
alt+B       script-binding mu_notes/notes-menu
alt+u       script-binding mu_study/clip

# — biblioteca, mando, salas y tele
ctrl+b      script-binding mu_library/library-menu
alt+z       script-binding mu_remote/remote-qr
alt+Z       script-binding mu_remote/remote-menu
alt+W       script-binding mu_share/share-menu
alt+Q       script-binding mu_share/share-qr
alt+E       script-binding mu_cast/cast-menu
alt+F       script-binding mu_modes/mini-toggle

# — resumen e índice
alt+R       script-binding mu_recap/recap
alt+I       script-binding mu_recap/outline

# — audiolibros, letras y música
alt+A       script-binding mu_books/books-menu
alt+J       script-binding mu_books/back-30
alt+L       script-binding mu_books/forward-30
alt+K       script-binding mu_lyrics/lyrics-menu
alt+M       script-binding mu_music/music-menu

# — salir
q           script-binding mu_core/quit-ask
