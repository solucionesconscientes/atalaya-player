# MPV-UOS · teclas base. Los comentarios `#!` construyen el menú de uosc (script-binding uosc/menu).
# Documentación completa de atajos: docs/ATAJOS.md (H4). Sintaxis validada contra el README de uosc 5.13.

MENU        script-binding uosc/menu
MBTN_RIGHT  script-binding uosc/menu
o           script-binding uosc/open-file              #! Abrir archivo
p           script-binding uosc/playlist               #! Lista de reproducción
c           script-binding uosc/chapters               #! Capítulos
s           script-binding uosc/subtitles              #! Subtítulos
alt+s       script-binding uosc/load-subtitles         #! Cargar subtítulos
a           script-binding uosc/audio                  #! Audio
v           script-binding uosc/video                  #! Pistas de vídeo
e           script-binding uosc/editions               #! Ediciones
ctrl+q      script-binding uosc/stream-quality         #! Calidad del stream
#           #! ---
ctrl+s      async screenshot                           #! Captura de pantalla
ctrl+o      script-binding uosc/open-config-directory  #! Abrir carpeta de configuración
alt+o       script-binding uosc/show-in-directory      #! Mostrar en la carpeta
#           #! ---
q           quit                                       #! Salir
