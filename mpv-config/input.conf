# MPV-UOS · teclas. Los comentarios `#!` construyen el menú de uosc (script-binding uosc/menu); una línea que
# empieza por `#` y lleva `#!` añade una entrada al menú sin tecla. Todas las teclas: docs/ATAJOS.md.
# Los atajos por defecto de mpv 0.41 siguen activos salvo los que se redefinen aquí (tabla en docs/ATAJOS.md).

MENU        script-binding mu_menu/root
MBTN_RIGHT  script-binding mu_menu/root
alt+m       script-binding mu_menu/root                #! MPV-UOS > Menú principal
alt+p       script-binding mu_menu/palette             #! MPV-UOS > Buscar comandos, canales y recientes
alt+h       script-binding mu_menu/recents             #! MPV-UOS > Recientes / continuar viendo
?           script-binding mu_menu/help                #! MPV-UOS > Ayuda (teclas principales)
#           script-binding mu_record/record-menu       #! Grabar > Menú (capturas, grabar desde ahora, recortar tramo)
#           script-binding mu_menu/click-pause-toggle  #! MPV-UOS > Pausar con un clic en el vídeo (sí / no)
ctrl+m      script-binding uosc/menu
#           script-binding uosc/keybinds               #! MPV-UOS > Todas las teclas (buscador)
#           #! ---
SPACE       cycle pause                                #! Reproducir / pausa
o           script-binding uosc/open-file              #! Abrir archivo
ctrl+v      loadfile "${clipboard/text}" replace       #! Abrir URL o ruta copiada (portapapeles)
ctrl+u      script-binding mu_ytdl/open-url            #! Abrir URL…
ctrl+f      script-binding mu_ytdl/yt-search           #! Buscar en YouTube
p           script-binding uosc/playlist               #! Lista de reproducción
c           script-binding uosc/chapters               #! Capítulos
e           script-binding uosc/editions               #! Ediciones
#           #! ---
f           cycle fullscreen                           #! Ver > Pantalla completa
#           script-binding uosc/video                  #! Ver > Pistas de vídeo
A           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"  #! Ver > Relación de aspecto
d           cycle deinterlace                          #! Ver > Desentrelazar (auto / sí / no)
ctrl+q      script-binding uosc/stream-quality         #! Ver > Calidad del stream
m           cycle mute                                 #! Audio > Silenciar
a           script-binding uosc/audio                  #! Audio > Pistas de audio
#           script-binding uosc/audio-device           #! Audio > Dispositivo de salida
s           script-binding uosc/subtitles              #! Subtítulos > Pistas de subtítulos
alt+s       script-binding uosc/load-subtitles         #! Subtítulos > Cargar archivo de subtítulos
v           cycle sub-visibility                       #! Subtítulos > Mostrar / ocultar
ctrl+alt+v  cycle secondary-sub-visibility             #! Subtítulos > Mostrar / ocultar los secundarios
[           multiply speed 1/1.1                       #! Velocidad > Más lenta
]           multiply speed 1.1                         #! Velocidad > Más rápida
BS          set speed 1.0                              #! Velocidad > Normal
L           cycle-values loop-file "inf" "no"          #! Repetir > Repetir este archivo
#           cycle-values loop-playlist "inf" "no"      #! Repetir > Repetir la lista
#           script-binding uosc/shuffle                #! Repetir > Orden aleatorio
l           ab-loop                                    #! Repetir > Bucle A-B (marcar inicio / fin / quitar)
#           #! ---
ctrl+s      async screenshot                           #! Captura de pantalla
ctrl+o      script-binding uosc/open-config-directory  #! Abrir carpeta de configuración
alt+o       script-binding uosc/show-in-directory      #! Mostrar en la carpeta
#           #! ---
alt+t       script-binding mu_iptv/tv-menu             #! TV y radio > Menú de canales
alt+f       script-binding mu_iptv/tv-search           #! TV y radio > Buscar canal o emisora
alt+UP      script-binding mu_iptv/zap-next            #! TV y radio > Canal siguiente
alt+DOWN    script-binding mu_iptv/zap-prev            #! TV y radio > Canal anterior
alt+G       script-binding mu_iptv/tv-guide            #! TV y radio > Guía del canal que estás viendo
#           script-binding mu_iptv/tv-schedule         #! TV y radio > Grabaciones programadas
#           script-binding mu_iptv/tv-tracks           #! TV y radio > Audio y subtítulos del canal (VO, AD, CC)
alt+r       script-binding mu_record/record-toggle     #! Grabar > Grabar desde ahora / detener (directo, vídeo o archivo)
#           script-binding mu_record/record-audio-toggle #! Grabar > Grabar solo el audio desde ahora / detener
#           #! ---
alt+y       script-binding mu_ytdl/ytdl-menu           #! Vídeos de internet > Menú (calidad, descargas)
alt+a       script-binding mu_ytdl/ytdl-toggle-audio   #! Vídeos de internet > Solo audio / vídeo
alt+q       script-binding mu_ytdl/ytdl-quality        #! Vídeos de internet > Calidad
alt+d       script-binding mu_ytdl/ytdl-download       #! Vídeos de internet > Descargar
alt+l       script-binding mu_ytdl/ytdl-downloads      #! Vídeos de internet > Descargas
alt+C       script-binding mu_convert/convert-menu     #! Convertir > Convertir vídeo o audio (archivo o carpeta)
alt+T       script-binding mu_convert/tasks-menu       #! Convertir > Tareas (descargas y conversiones)
#           #! ---
alt+i       script-binding mu_subs/subs-menu           #! Subtítulos IA > Menú (idioma, modelo, estado)
alt+c       script-binding mu_subs/subs-toggle         #! Subtítulos IA > Iniciar / detener
alt+x       script-binding mu_subs/subs-resync         #! Subtítulos IA > Resincronizar la pista externa
alt+S       script-binding mu_subs/subs-save           #! Subtítulos IA > Guardar subtítulos (SRT)
#           #! ---
alt+v       script-binding mu_av/av-menu                #! Sonido e imagen > Menú (filtros, diagnóstico)
alt+n       script-binding mu_av/av-night               #! Sonido e imagen > Modo noche
#           #! ---
alt+k       script-binding mu_intro/skip                #! Saltar intro / créditos
alt+j       script-binding mu_intro/intro-menu          #! Saltar intro / créditos > Menú (segmentos, automático)
#           script-binding mu_intro/intro-mark-start    #! Saltar intro / créditos > Marcar inicio de la intro
#           script-binding mu_intro/intro-mark-end      #! Saltar intro / créditos > Marcar final de la intro
#           script-binding mu_intro/credits-mark-start  #! Saltar intro / créditos > Marcar inicio de los créditos
#           script-binding mu_intro/credits-mark-end    #! Saltar intro / créditos > Marcar final de los créditos
#           script-binding mu_intro/intro-season        #! Saltar intro / créditos > Analizar temporada
#           script-binding mu_intro/intro-export        #! Saltar intro / créditos > Exportar segmentos (Jellyfin)
#           #! ---
alt+e       script-binding mu_study/study-menu          #! Estudio > Menú (repetir, velocidad inteligente, notas, clips)
alt+w       script-binding mu_study/repeat-line         #! Estudio > Repetir la línea de subtítulo actual
alt+LEFT    script-binding mu_study/repeat-prev         #! Estudio > Repetir la línea anterior
alt+RIGHT   script-binding mu_study/repeat-next         #! Estudio > Repetir la línea siguiente
alt+g       script-binding mu_study/smart-speed         #! Estudio > Velocidad inteligente (acelera silencios)
alt+b       script-binding mu_study/note                #! Estudio > Nota con enlace de tiempo
alt+B       script-binding mu_notes/notes-menu          #! Mis notas (saltar al minuto, editar, borrar, exportar)
alt+u       script-binding mu_study/clip                #! Estudio > Exportar clip del bucle A-B / línea
#           #! ---
ctrl+b      script-binding mu_library/library-menu      #! Biblioteca (películas, series, seguir viendo, carpetas)
#           script-binding mu_library/library-next      #! Biblioteca > Siguiente episodio ahora
#           script-binding mu_library/library-subs      #! Biblioteca > Buscar subtítulos en internet (OpenSubtitles)
#           script-binding mu_library/auto-next-toggle  #! Biblioteca > Siguiente episodio automático: sí / no
#           #! ---
alt+z       script-binding mu_remote/remote-qr          #! Mando a distancia > Mostrar / ocultar QR para el móvil
alt+Z       script-binding mu_remote/remote-menu        #! Mando a distancia > Menú (estado, móviles, olvidar)
#           #! ---
alt+W       script-binding mu_share/share-menu          #! Compartir > Ver juntos (sala, invitados, cerrar)
#           script-binding mu_share/share-qr            #! Compartir > Mostrar / ocultar el QR de la sala
#           #! ---
alt+F       script-binding mu_modes/mini-toggle         #! Modos > Mini reproductor (ventana pequeña encima)
#           script-binding mu_modes/salon-toggle        #! Modos > Modo salón (letra grande, mando de consola)
#           script-binding mu_modes/simple-toggle       #! Modos > Modo sencillo (menú corto)
#           #! ---
q           quit                                       #! Salir
