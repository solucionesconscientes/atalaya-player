# MPV-UOS · teclas base. Los comentarios `#!` construyen el menú de uosc (script-binding uosc/menu).
# Documentación completa de atajos: docs/ATAJOS.md (H4). Sintaxis validada contra el README de uosc 5.13.

MENU        script-binding mu_menu/root
MBTN_RIGHT  script-binding mu_menu/root
alt+m       script-binding mu_menu/root                #! MPV-UOS > Menú principal
alt+p       script-binding mu_menu/palette             #! MPV-UOS > Buscar comandos, canales y recientes
alt+h       script-binding mu_menu/recents             #! MPV-UOS > Recientes / continuar viendo
ctrl+m      script-binding uosc/menu
o           script-binding uosc/open-file              #! Abrir archivo
p           script-binding uosc/playlist               #! Lista de reproducción
c           script-binding uosc/chapters               #! Capítulos
s           script-binding uosc/subtitles              #! Subtítulos
alt+s       script-binding uosc/load-subtitles         #! Cargar subtítulos
a           script-binding uosc/audio                  #! Audio
v           script-binding uosc/video                  #! Pistas de vídeo
e           script-binding uosc/editions               #! Ediciones
ctrl+q      script-binding uosc/stream-quality         #! Calidad del stream
#           #! ---
ctrl+s      async screenshot                           #! Captura de pantalla
ctrl+o      script-binding uosc/open-config-directory  #! Abrir carpeta de configuración
alt+o       script-binding uosc/show-in-directory      #! Mostrar en la carpeta
#           #! ---
alt+t       script-binding mu_iptv/tv-menu             #! TV y radio > Menú de canales
alt+f       script-binding mu_iptv/tv-search           #! TV y radio > Buscar canal o emisora
alt+UP      script-binding mu_iptv/zap-next            #! TV y radio > Canal siguiente
alt+DOWN    script-binding mu_iptv/zap-prev            #! TV y radio > Canal anterior
alt+r       script-binding mu_iptv/record-toggle       #! TV y radio > Grabar / detener grabación
#           #! ---
alt+y       script-binding mu_ytdl/ytdl-menu           #! yt-dlp > Menú (calidad, descargas)
alt+a       script-binding mu_ytdl/ytdl-toggle-audio   #! yt-dlp > Solo audio / vídeo
alt+q       script-binding mu_ytdl/ytdl-quality        #! yt-dlp > Calidad
alt+d       script-binding mu_ytdl/ytdl-download       #! yt-dlp > Descargar
alt+l       script-binding mu_ytdl/ytdl-downloads      #! yt-dlp > Descargas
#           #! ---
alt+i       script-binding mu_subs/subs-menu           #! Subtítulos IA > Menú (idioma, modelo, estado)
alt+c       script-binding mu_subs/subs-toggle         #! Subtítulos IA > Iniciar / detener
alt+x       script-binding mu_subs/subs-resync         #! Subtítulos IA > Resincronizar la pista externa
#           #! ---
q           quit                                       #! Salir
