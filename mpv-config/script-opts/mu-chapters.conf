# mu-chapters · «Capítulos con una IA externa» (H75, ADR-134, docs/capitulos-ia/)
# Aquí NO hay ni una tecla: las teclas viven todas en input.conf (ADR-083) y están en docs/ATAJOS.md.
# Los valores de debajo son los que trae el script; se pueden cambiar también al arrancar, que manda más:
#   bin/mpv-uos --script-opts=mu-chapters-min_gap=90 pelicula.mkv
# y desde Ajustes/Preferencias cuando la fila existe (prefs.json manda sobre este fichero, ver ADR-020).

# No pisar los capítulos que ya trae el archivo o la pista (los de una película, los del índice de mpvd…):
# al pegar, si el vídeo trae capítulos propios se avisa y no se toca nada. Ponlo en no para aplicar los tuyos igual.
respect_existing=yes

# Segundos que tienen que pasar entre dos capítulos. El que no llega se descarta y se queda el de antes.
# 45 s = el mínimo que pide el prompt; el pegado a mano de un archivo tampoco baja de aquí.
min_gap=45

# Segundos que puede moverse un tiempo de la IA para caer en el inicio de un subtítulo (los tiempos redondeados
# a mano por la IA casi nunca caen justo). Si más de la mitad de los tiempos no caen a esta distancia, se pide
# confirmación antes de aplicar nada: es la señal de que la respuesta es de otro vídeo.
tolerance=15

# Segundos de voz que se juntan en cada línea de la transcripción compacta que se copia (10-15 va bien para
# cualquier IA; menos líneas = menos tokens, pero se pierde el detalle de dónde empieza cada tema).
line_seconds=12

# Cuántos segundos se queda en pantalla la pregunta de «los tiempos no parecen de esta transcripción» sin
# contestar antes de darla por cancelada (sin uosc se contesta que no, sin preguntar).
confirm_seconds=30

# Cuántos segundos se queda cada aviso en pantalla.
osd_seconds=5
