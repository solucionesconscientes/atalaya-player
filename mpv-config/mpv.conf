# MPV-UOS · configuración portable. Se carga SOLO a través de bin/mpv-uos (--config-dir=<proyecto>/mpv-config).
# Cada clave está validada contra `mpv --list-options` de mpv 0.41 por tests/test_config.py.

## Vídeo
vo=gpu-next
hwdec=auto-safe
# No se fuerza profile=high-quality: objetivo mínimo = portátil de 4 núcleos sin GPU dedicada.

## Interfaz: uosc sustituye al OSC y a la barra OSD nativos
osc=no
osd-bar=no
cursor-autohide=1000
keep-open=yes

## Sesión
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
watch-later-dir=~~/watch_later

## Audio y subtítulos
volume-max=150
sub-auto=fuzzy
slang=es,spa,en,eng
alang=es,spa,en,eng

## Red y yt-dlp (el binario vendorizado y las opciones finas llegan en H3)
ytdl=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

## Capturas
screenshot-dir=~~desktop/
screenshot-template=mpv-uos-%F-%P
