# MPV-UOS · configuración portable. Se carga SOLO a través de bin/mpv-uos (--config-dir=<proyecto>/mpv-config).
# Cada clave está validada contra `mpv --list-options` de mpv 0.41 por tests/test_config.py.

## Vídeo
vo=gpu-next
# VA-API primero (Intel/AMD en Linux: H.264/HEVC por hardware); si no hay, la lista segura de mpv.
hwdec=vaapi,auto-safe
# Desentrelaza solo lo que viene marcado como entrelazado (muchos canales de TDT emiten 1080i/576i).
deinterlace=auto
# No se fuerza profile=high-quality: objetivo mínimo = portátil de 4 núcleos sin GPU dedicada.

## Ventana: icono y agrupación de MPV-UOS en el escritorio aunque se abra desde la terminal
wayland-app-id=mpv-uos
x11-name=mpv-uos

## Interfaz: uosc sustituye al OSC y a la barra OSD nativos
osc=no
osd-bar=no
cursor-autohide=1000
keep-open=yes

## Sesión
# La posición y los ajustes de CADA archivo (pistas, retardos, zoom…). Lo global (volumen, velocidad, filtros,
# subtítulos a gusto) lo guarda mu-prefs; si watch_later también lo guardase, se arrastraría al siguiente archivo.
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
# bin/mpv-uos lo sustituye por <datos de usuario>/watch_later (fuera del proyecto).
watch-later-dir=~~/watch_later
watch-later-options=start,edition,aid,sid,secondary-sid,audio-delay,sub-delay,secondary-sub-delay,sub-speed,ab-loop-a,ab-loop-b,video-aspect-override,panscan,video-zoom,video-pan-x,video-pan-y,video-rotate,video-crop,deinterlace
# Lo que un archivo restaura no pasa al siguiente (antes: el siguiente heredaba pista de audio inexistente → sin sonido).
reset-on-next-file=edition,aid,sid,secondary-sid,audio-delay,sub-delay,secondary-sub-delay,sub-speed,video-aspect-override,panscan,video-zoom,video-pan-x,video-pan-y,video-rotate,video-crop,deinterlace

## Audio y subtítulos
volume-max=150
sub-auto=fuzzy
slang=es,spa,en,eng
alang=es,spa,en,eng

## Red y yt-dlp (binario vendorizado en vendor/bin; mu-ytdl lo configura)
ytdl=yes
# H.264 primero si no se sabe más; mu-ytdl lo cambia por el códec que el equipo decodifica por hardware (H31, ytdl.hw)
# mientras este valor siga igual (si lo cambias, se respeta y se recuerda). Mantener igual que FACTORY_FORMAT de mu-ytdl.
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/bestvideo[height<=?1080]+bestaudio/best

## Capturas
screenshot-dir=~~desktop/
screenshot-template=mpv-uos-%F-%P

## Perfiles automáticos
# Desentrelazar exige fotogramas en memoria: con hwdec=vaapi mpv usaría vavpp, que el driver iHD de Intel Skylake no
# ofrece. Mientras se desentrelaza, decodificar con copia para que actúe bwdif (≈ un tercio de un núcleo en 1080i).
[mu-deint-copy]
profile-desc=Desentrelazar por software (bwdif)
profile-cond=p.deinterlace == true or p["deinterlace-active"] == true
profile-restore=copy
hwdec=vaapi-copy,auto-copy-safe
