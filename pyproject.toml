[project]
name = "mpvd"
version = "0.1.0"
description = "Companion daemon for MPV-UOS: heavy lifting (AI, network, indexes, downloads) next to mpv, over JSON-RPC"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
mpvd = "mpvd.__main__:main"

[project.optional-dependencies]
translate = [
    "ctranslate2>=4.8,<5",
    "sentencepiece>=0.2",
]
semantic = [
    "onnxruntime>=1.30,<2",
    "numpy>=2.0",
    "sentencepiece>=0.2",
]
# yt-dlp browser impersonation (TikTok & co.): the range the vendored yt-dlp accepts (yt_dlp/networking/_curlcffi.py)
impersonate = [
    "curl-cffi>=0.10,<0.17; implementation_name == 'cpython'",
]

# H59 · ver un torrent mientras se descarga. Ruedas oficiales en PyPI (BSD), cp312 para Linux x86_64/aarch64 y
# musl, Windows 32/64 y macOS arm64/x86_64. Extra opcional: sin él, el servicio no se anuncia y nada lo ofrece.
torrent = [
    "libtorrent>=2.0,<3",
]

# desktop integration on Linux (MPRIS over the session D-Bus): pure Python, no dependencies
desktop = [
    "jeepney>=0.8,<1; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mpvd"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra -m 'not network'"
timeout = 180
markers = [
  "network: needs internet access (run with -m network)",
]
